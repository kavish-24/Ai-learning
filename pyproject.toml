[project]
name = "langchain-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kavish-24", email = "kavishtoraskar24@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.19",
    "langsmith>=0.14.16",
    "pydantic>=2.14.2",
    "pymupdf>=2.1",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sentence-transformers>=6.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
langchain-learning = "langchain_learning:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
